---
business_bi:
    target: "{{ env_var('DBT_TARGET', 'dev') }}"
    outputs:
        dev:
            type: bigquery
            method: oauth
            project: lumapps-business-bi
            execution_project: lumapps-business-bi
            location: EU
            dataset: gold
            timeout_seconds: 3000
            threads: 4
            priority: interactive

        prod:
            type: bigquery
            method: service-account
            keyfile: "{{ env_var('DBT_ENV_SECRET_BQ_SA') }}"
            project: lumapps-business-bi
            execution_project: lumapps-business-bi
            location: EU
            dataset: gold
            timeout_seconds: 3000
            threads: 4
            priority: interactive
