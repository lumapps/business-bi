---
default_environment: dev
requires_meltano: ">=4.0"
project_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890

environments:
    - name: dev
    - name: prod

plugins:
    extractors:
        - name: tap-travel-perk
          namespace: tap_travel_perk
          pip_url: ${TAP_TRAVEL_PERK_PATH}
          executable: tap-travel-perk
          capabilities:
              - catalog
              - discover
              - state
          settings:
              - name: api_key
                kind: string
                sensitive: true
              - name: api_url
                kind: string
                value: https://api.perk.com

    loaders:
        - name: target-bigquery
          variant: z3z1ma
          pip_url: "z3-target-bigquery setuptools<82.0.0 protobuf>=3.20.0,<5.0.0"
          config:
              project: lumapps-business-bi
              dataset: meltano
              location: EU
              method: storage_write_api
              schema_resolver_version: 2
              batch_size: 250

        - name: target-bigquery-dev
          inherit_from: target-bigquery
          config:
              dataset: meltano_dev

        - name: target-jsonl
          variant: andyh1203
          pip_url: target-jsonl

env:
    TAP_TRAVEL_PERK_PATH: ../extractors/tap-travel-perk
