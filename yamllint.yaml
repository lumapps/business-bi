---
extends: default
ignore: |
    venv/
    venv-meltano/
    dbt/dbt_packages/
rules:
    line-length:
        max: 130
    comments-indentation: disable
    comments:
        require-starting-space: true
        ignore-shebangs: true
        min-spaces-from-content: 1
    truthy:
        allowed-values: ['true', 'false', 'yes', 'no']
        check-keys: false
